  <template id="game-dialogs">
  <dialog id="rules-dialog" class="dialog rules-dialog" aria-labelledby="rules-title"><button class="icon-button dialog-close" data-close-dialog aria-label="关闭玩法说明"><svg class="icon"><use href="#icon-close"/></svg></button><p class="eyebrow">HOW TO PLAY</p><h2 id="rules-title">简单规则，无限可能。</h2><ol class="rules-list"><li><strong>黑棋先行，交替落子</strong><p>在 15×15 棋盘的空白交点放下一颗棋子，你与电脑轮流。</p></li><li><strong>连成五子，即可获胜</strong><p>横向、纵向、两条斜线都可以。五颗或更多连续的同色棋子即获胜，棋盘下满仍无胜者则为和棋。</p></li><li><strong>自由规则，没有禁手</strong><p>本游戏采用休闲自由规则，不设置三三、四四或长连禁手。</p></li><li><strong>给自己一次反悔的机会</strong><p>悔棋会回到你上一次落子前。对局会保存在当前浏览器，刷新后可继续。</p></li></ol><div class="keyboard-tip">键盘也能玩：方向键选择交点，Enter / 空格落子。</div><button class="button button-primary" data-close-dialog>知道了，开始落子</button></dialog>
  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title"><p class="eyebrow">A FRESH START</p><h2 id="confirm-title">再来一局？</h2><p class="dialog-description">当前棋局将被清空，使用新的设置重新开始。</p><div class="dialog-actions"><button class="button button-secondary" data-close-dialog>继续这一局</button><button class="button button-primary" id="confirm-new-game">开始新对局</button></div></dialog>
  <dialog id="snake-rules-dialog" class="dialog rules-dialog" aria-labelledby="snake-rules-title"><button class="icon-button dialog-close" data-close-dialog aria-label="关闭贪吃蛇玩法说明"><svg class="icon"><use href="#icon-close"/></svg></button><p class="eyebrow">HOW TO PLAY</p><h2 id="snake-rules-title">快乐，一口一口来。</h2><ol class="rules-list"><li><strong>控制方向，寻找点心</strong><p>使用方向键、WASD 或场地下方的方向按钮。蛇会持续前进，不能直接掉头。</p></li><li><strong>每吃一口，加 10 分</strong><p>吃到红色点心，蛇身增长一格。填满整个 20×20 场地即可通关。</p></li><li><strong>别撞墙，也别撞到自己</strong><p>碰到场地边界或自己的身体，这一局就结束了。历史最高分会保存在当前浏览器。</p></li><li><strong>随时暂停，回来继续</strong><p>空格或暂停按钮可暂停、继续。离开页面、切换标签或查看规则时会自动暂停；刷新页面会开始新的一局。</p></li></ol><button class="button button-primary" data-close-dialog>知道了</button></dialog>
  <dialog id="snake-confirm-dialog" class="dialog" aria-labelledby="snake-confirm-title"><p class="eyebrow">A FRESH START</p><h2 id="snake-confirm-title">换个节奏，再来一局？</h2><p class="dialog-description">重新开始会清空本局进度，历史最高分会保留。取消后可手动继续。</p><div class="dialog-actions"><button class="button button-secondary" data-close-dialog>保留这一局</button><button class="button button-primary" id="snake-confirm-restart">重新开始</button></div></dialog>
  <dialog id="tetris-rules-dialog" class="dialog rules-dialog" aria-labelledby="tetris-rules-title"><button class="icon-button dialog-close" data-close-dialog aria-label="关闭俄罗斯方块玩法说明"><svg class="icon"><use href="#icon-close"/></svg></button><p class="eyebrow">HOW TO PLAY</p><h2 id="tetris-rules-title">一行一行，拼出快乐。</h2><ol class="rules-list"><li><strong>移动、旋转，安排落点</strong><p>使用 ← → 或 A / D 移动，↑ / W / X 顺时针旋转，Z 逆时针旋转。描边方块提示落点，右侧预览接下来三个方块。</p></li><li><strong>填满一行，就能消除</strong><p>七种形状按组打乱出现。填满横向 10 格即可消行，上面的方块会落下来；方块堆到顶部无法出场时结束。</p></li><li><strong>多消多得，逐步加速</strong><p>一次消除 1 / 2 / 3 / 4 行分别获得 100 / 300 / 500 / 800 基础分，再乘当前等级。每消除 10 行升一级，落速逐渐加快。</p></li><li><strong>落下、暂停，都由你决定</strong><p>↓ / S 下移每格加 1 分，空格直接落下并固定，每格加 2 分。P / Esc 或暂停按钮可暂停、继续，手机使用操作按钮。</p></li><li><strong>离开时，为你留住这一局</strong><p>切换游戏、标签、窗口或查看规则会自动暂停，返回后手动继续。最高分保存在当前浏览器；刷新会开始新的一局。</p></li></ol><button class="button button-primary" data-close-dialog>知道了，开始拼方块</button></dialog>
  <dialog id="tetris-confirm-dialog" class="dialog" aria-labelledby="tetris-confirm-title"><p class="eyebrow">A FRESH START</p><h2 id="tetris-confirm-title">再拼一局？</h2><p class="dialog-description">重新开始会清空本局进度，历史最高分会保留。取消后可手动继续。</p><div class="dialog-actions"><button class="button button-secondary" data-close-dialog>保留这一局</button><button class="button button-primary" id="tetris-confirm-restart">重新开始</button></div></dialog>
  </template>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript">请在浏览器中启用 JavaScript，即可开始游戏。</div></noscript>
</body>
</html>
